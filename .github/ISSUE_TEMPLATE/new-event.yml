name: New event (PGP-signed)
description: Add an event to the Bordel calendar. Only events signed by a trusted organizer key are published.
title: "New event"
body:
  - type: markdown
    attributes:
      value: |
        **How to add an event**

        1. Write the event into a text file, e.g. `event.txt` (one `key: value` per line):

           ```
           title: Soldering for beginners
           start: 2026-12-12 17:00
           duration: 150
           type: workshop
           location: Bordel
           bring: Nothing, kits provided
           description: Build a small blinky kit.
           ```

           - **Required:** `title`, `start` (`YYYY-MM-DD HH:MM` with leading zeros, Prague time), `type`
           - `type` is one of: `workshop`, `talk`, `ctf`, `meetup`, `party`, `event`
           - Optional: `duration` (minutes, default 120), `location`, `bring`, `description`
           - `description` must be the **last** line; it may continue over several lines

        2. Sign it: `gpg --clearsign event.txt` → this creates `event.txt.asc`
           (sign shortly before submitting: signatures older than 30 days, or already used once, are rejected)
        3. Paste the **whole** content of `event.txt.asc` below (from `-----BEGIN PGP SIGNED MESSAGE-----` to `-----END PGP SIGNATURE-----`).

        A bot checks the signature against the keys in [`events/keys/`](../tree/master/events/keys). If it is valid, the event goes live within a few minutes and this issue is closed.
  - type: textarea
    id: signed-event
    attributes:
      label: Signed event
      description: The full clearsigned block from `gpg --clearsign`.
      render: text
      placeholder: |
        -----BEGIN PGP SIGNED MESSAGE-----
        Hash: SHA512

        title: ...
        start: 2026-12-12 17:00
        type: workshop
        -----BEGIN PGP SIGNATURE-----
        ...
        -----END PGP SIGNATURE-----
    validations:
      required: true
